<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="tokenBase" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a2a22" />
      <stop offset="65%" stop-color="#041611" />
      <stop offset="92%" stop-color="#020b08" />
      <stop offset="100%" stop-color="#000402" />
    </radialGradient>

    <!-- Metallic Gold Outer Rim -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fceda2" />
      <stop offset="25%" stop-color="#d4af37" />
      <stop offset="50%" stop-color="#8a6e14" />
      <stop offset="75%" stop-color="#ffd700" />
      <stop offset="100%" stop-color="#a38218" />
    </linearGradient>

    <!-- Emerald Circuit Gradient -->
    <linearGradient id="emeraldCircuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5c4" />
      <stop offset="50%" stop-color="#00a884" />
      <stop offset="100%" stop-color="#005a46" />
    </linearGradient>

    <!-- Glowing Center Hologram -->
    <radialGradient id="holoGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f5c4" stop-opacity="0.35" />
      <stop offset="40%" stop-color="#00d2aa" stop-opacity="0.18" />
      <stop offset="75%" stop-color="#d4af37" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Dark Plate -->
  <circle cx="300" cy="300" r="290" fill="url(#tokenBase)" />

  <!-- Outer Milled Security Teeth (Digital Edge) -->
  <circle cx="300" cy="300" r="285" fill="none" stroke="url(#goldRim)" stroke-width="4" />
  <circle cx="300" cy="300" r="278" fill="none" stroke="#00f5c4" stroke-width="1.5" stroke-dasharray="3, 4" opacity="0.8" />

  <!-- Concentric Quantum Hash Matrix -->
  <circle cx="300" cy="300" r="255" fill="none" stroke="url(#goldRim)" stroke-width="1" opacity="0.4" />
  <circle cx="300" cy="300" r="248" fill="none" stroke="#00f5c4" stroke-width="2" stroke-dasharray="6, 8" opacity="0.7" />

  <!-- Top Inscription Curved: RESERVE BANK OF INDIA -->
  <path id="curveTop" fill="none" d="M 75 300 A 225 225 0 0 1 525 300" />
  <text font-family="'Space Grotesk', 'DM Mono', monospace, sans-serif" font-size="19" font-weight="700" fill="url(#goldRim)" letter-spacing="7">
    <textPath href="#curveTop" startOffset="50%" text-anchor="middle">
      RESERVE BANK OF INDIA
    </textPath>
  </text>

  <!-- Bottom Inscription Curved: DIGITAL RUPEE · SOVEREIGN CBDC -->
  <path id="curveBottom" fill="none" d="M 525 300 A 225 225 0 0 1 75 300" />
  <text font-family="'Space Grotesk', 'DM Mono', monospace, sans-serif" font-size="17" font-weight="600" fill="#00f5c4" letter-spacing="6">
    <textPath href="#curveBottom" startOffset="50%" text-anchor="middle">
      DIGITAL RUPEE · SOVEREIGN e₹
    </textPath>
  </text>

  <!-- Inner Hologram Disc -->
  <circle cx="300" cy="300" r="185" fill="url(#holoGlow)" />
  <circle cx="300" cy="300" r="185" fill="none" stroke="url(#goldRim)" stroke-width="2" opacity="0.7" />
  <circle cx="300" cy="300" r="176" fill="none" stroke="#00f5c4" stroke-width="1" stroke-dasharray="2, 6" opacity="0.6" />

  <!-- Radiating Digital Circuit Bus Lines -->
  <g stroke="#00f5c4" stroke-width="1.2" opacity="0.45">
    <line x1="300" y1="120" x2="300" y2="155" />
    <line x1="300" y1="445" x2="300" y2="480" />
    <line x1="120" y1="300" x2="155" y2="300" />
    <line x1="445" y1="300" x2="480" y2="300" />

    <line x1="172" y1="172" x2="198" y2="198" />
    <line x1="402" y1="402" x2="428" y2="428" />
    <line x1="428" y1="172" x2="402" y2="198" />
    <line x1="172" y1="428" x2="198" y2="402" />

    <!-- Bus Interconnect Node Dots -->
    <circle cx="198" cy="198" r="3" fill="#ffd700" />
    <circle cx="402" cy="198" r="3" fill="#00f5c4" />
    <circle cx="198" cy="402" r="3" fill="#00f5c4" />
    <circle cx="402" cy="402" r="3" fill="#ffd700" />
  </g>

  <!-- State Emblem Crest / Ashoka Lions Miniature Graphic -->
  <g transform="translate(285, 175) scale(0.65)" fill="url(#goldRim)" opacity="0.9">
    <path d="M 23 5 C 10 5, 5 15, 5 25 C 5 32, 10 38, 23 42 C 36 38, 41 32, 41 25 C 41 15, 36 5, 23 5 Z" />
    <circle cx="23" cy="22" r="5" fill="#00f5c4" />
    <!-- Pedestal wheel -->
    <circle cx="23" cy="46" r="4" fill="none" stroke="url(#goldRim)" stroke-width="1.5" />
  </g>

  <!-- Central Prominent e₹ Digital Rupee Sovereign Symbol -->
  <!-- Stylized lower-case 'e' intertwined with the Devanagari Rupee Symbol '₹' -->
  <g transform="translate(180, 205)" filter="url(#glowEffect)">
    <!-- Holographic shadow -->
    <text x="122" y="142" font-family="'Space Grotesk', 'Playfair Display', sans-serif" font-size="124" font-weight="800" fill="#003d2e" text-anchor="middle">
      e₹
    </text>
    <!-- Foreground Metallic Symbol -->
    <text x="120" y="140" font-family="'Space Grotesk', 'Playfair Display', sans-serif" font-size="124" font-weight="800" fill="url(#goldRim)" text-anchor="middle">
      e₹
    </text>
  </g>

  <!-- Sub-label below e₹: CENTRAL BANK DIGITAL CURRENCY -->
  <text x="300" y="375" font-family="'DM Mono', monospace" font-size="11" font-weight="600" fill="#00f5c4" letter-spacing="3" text-anchor="middle">
    CENTRAL BANK DIGITAL CURRENCY
  </text>
  <text x="300" y="393" font-family="'DM Mono', monospace" font-size="10" font-weight="500" fill="url(#goldRim)" letter-spacing="4" text-anchor="middle">
    SOVEREIGN RETAIL (CBDC-R)
  </text>

  <!-- Micro Cryptographic Hash Fingerprint around the inner edge -->
  <text x="300" y="425" font-family="'DM Mono', monospace" font-size="8" fill="#52796f" letter-spacing="1.5" text-anchor="middle">
    SHA-256: 0x9b42e...881f · QUANTUM-RESISTANT ECDSA
  </text>
</svg>
